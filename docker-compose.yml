services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TOTAL_ROUNDS=${TOTAL_ROUNDS:-4}
      - BUILD_TIMEOUT_SEC=${BUILD_TIMEOUT_SEC:-180}
    volumes:
      - ./backend:/app
    working_dir: /app
    command: ["go", "run", "./cmd/server"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # 5173/5174 may be occupied by other projects' Service Workers / Vite.
      - "5175:5175"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PROXY_TARGET=http://backend:8080
      - VITE_PORT=5175
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5175"]
