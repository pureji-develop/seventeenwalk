server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Service Worker / manifest: always revalidate (do not long-cache).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /workbox-window.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/(workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets may be cached aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|mp3)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
