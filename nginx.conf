events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker 内部 DNS
    resolver 127.0.0.11 valid=30s;

    # =========================================================================
    # [Upstream定義] shared-net 内の各コンテナ名指定
    # =========================================================================

    # 1. ヘッズアップポーカー (taimanpoker)
    upstream taimanpoker_web_server {
        server taimanpoker-web-1:80;
    }
    upstream taimanpoker_backend_server {
        server taimanpoker-backend-1:8080;
    }

    # 2. アクワイア (acquire)
    upstream acquire_web_server {
        server acquire-web-container:80;
    }
    upstream acquire_backend_server {
        server acquire-backend-container:8081;
    }

    # 3. プエルトリコ (puertorico)
    upstream puertorico_web_server {
        server puertorico-web-1:80;
    }
    upstream puertorico_backend_server {
        server puertorico-backend:8080;
    }

    # 4. リングゲーム (ringgame)
    upstream ringgame_web_server {
        server ringgame-web-1:80;
    }
    upstream ringgame_backend_server {
        server ringgame-backend-1:8080;
    }

    # 5. 十七歩 (seventeenwalk)
    upstream seventeen_web_server {
        server seventeenwalk-web-1:80;
    }
    upstream seventeen_backend_server {
        server seventeenwalk-backend-1:8080;
    }


    # =========================================================================
    # 1. taimanpoker.com / dev.taimanpoker.com
    # =========================================================================
    server {
        listen 80;
        server_name taimanpoker.com dev.taimanpoker.com;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name taimanpoker.com dev.taimanpoker.com;

        ssl_certificate /etc/letsencrypt/live/taimanpoker.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taimanpoker.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://taimanpoker_web_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://taimanpoker_backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://taimanpoker_backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }


    # =========================================================================
    # 2. acquire.taimanpoker.com
    # =========================================================================
    server {
        listen 80;
        server_name acquire.taimanpoker.com;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name acquire.taimanpoker.com;

        ssl_certificate /etc/letsencrypt/live/acquire.taimanpoker.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/acquire.taimanpoker.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /ws {
            proxy_pass http://acquire_backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://acquire_web_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


    # =========================================================================
    # 3. puertorico.taimanpoker.com
