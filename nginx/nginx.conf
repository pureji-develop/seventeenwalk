events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker embedded DNS — resolve container_name hosts at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # -----------------------------------------------------
    # HTTP :80 — ACME + redirect to HTTPS
    # -----------------------------------------------------
    server {
        listen 80;
        server_name seventeenwalk.taimanpoker.com;

        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------
    # HTTPS :443 — SeventeenWalk
    # Upstream names match docker-compose.prod.yml container_name values.
    # Backend routes: /rooms, /ws, /health (no /api prefix).
    # -----------------------------------------------------
    server {
        listen 443 ssl;
        server_name seventeenwalk.taimanpoker.com;

        ssl_certificate     /etc/letsencrypt/live/seventeenwalk.taimanpoker.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/seventeenwalk.taimanpoker.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /health {
            set $upstream_api seventeenwalk-backend-1:8080;
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /rooms {
            set $upstream_api seventeenwalk-backend-1:8080;
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            set $upstream_api seventeenwalk-backend-1:8080;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            set $upstream_web seventeenwalk-web-1:80;
            proxy_pass http://$upstream_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
