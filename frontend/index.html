<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c2e24" />
    <meta name="description" content="2人用オンライン麻雀バリアント「十七歩」" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="十七歩" />
    <title>十七歩 — SeventeenWalk</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0c2e24;
        color: #e8eef4;
        font-family: 'Segoe UI', sans-serif;
        /* PWA standalone: avoid overscroll bounce */
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0c2e24;
        transition: opacity 0.35s ease;
      }
      #boot-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader .spin {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(232, 238, 244, 0.2);
        border-top-color: #e25b4a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="boot-loader">
      <div class="spin" aria-hidden="true"></div>
      <div>十七歩を読み込み中…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
